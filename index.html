    <script>
      if (['www.majdleenalyousef.com', 'majdleenalyousef.com'].includes(location.hostname)) {
        const measurementId = 'G-HE3SN992S3'
        window.dataLayer = window.dataLayer || []
        function gtag() {
          window.dataLayer.push(arguments)
        }

        gtag('js', new Date())
        gtag('config', measurementId)

        const tag = document.createElement('script')
        tag.async = true
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId
        document.head.append(tag)

        let previousScrollY = window.scrollY
        function trackFirstScroll() {
          const scrollY = window.scrollY
          if (scrollY > previousScrollY) {
            gtag('event', 'scroll_started')
            window.removeEventListener('scroll', trackFirstScroll)
          }
          previousScrollY = scrollY
        }

        window.addEventListener('scroll', trackFirstScroll, { passive: true })
      }
    </script>
